# CI-only overlay for scripts/ai/checks.py's helm() check (work-plan package
# H3): operatorJob's mode: adopt, command: plan combination. Not a
# deployment environment; only used by scripts/ai/check-helm.
#
# identity.existingConfigMap IS set here (unlike the onboard combinations):
# adopt resolves its acting principal from the identity file
# (internal/adoptcmd/principal.go), and templates/operator-job.yaml refuses
# to render mode: adopt without it.
identity:
  existingConfigMap: platform-ipam-identities-ci
operatorJob:
  enabled: true
  mode: adopt
  command: plan
  args: []
  runId: ci-adopt-plan
  input:
    existingConfigMap: platform-ipam-adopt-records-ci
    key: records.csv
# The chart-wide egress list (what api and worker get: the database, AWS, the
# OIDC issuer). Set here only so the helm check can tell it from onboard's own
# list: onboard's NetworkPolicy must never contain it, adopt's must equal the
# worker's.
networkPolicy:
  egress:
    - cidr: 10.0.99.0/24
      ports:
        - {protocol: TCP, port: 5432}
