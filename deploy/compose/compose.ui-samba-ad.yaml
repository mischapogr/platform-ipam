# Development-only Active Directory protocol gate. Run in its own Compose
# project; Samba's AD DC needs privileges for filesystem extended attributes.
# No directory port is published to the host.
services:
  samba-ad:
    image: quay.io/samba.org/samba-ad-server@sha256:ca2618022185e29deb717845b84b338202916410e423c134b57eb1ccc05b1ec4
    privileged: true
    environment:
      SAMBACC_CONFIG: /etc/samba/container.json
      SAMBA_CONTAINER_ID: demo
    volumes:
      - samba-ad-config:/etc/samba
      - ./samba-ad/container.json:/etc/samba/container.json:ro
      - samba-ad-state:/var/lib/samba
    networks:
      default:
        aliases:
          - dc1.ipam.test
    healthcheck:
      test: ["CMD-SHELL", "samba-tool user list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  netbox:
    environment:
      REMOTE_AUTH_ENABLED: "false"
      REMOTE_AUTH_BACKEND: netbox.authentication.LDAPBackend
      REMOTE_AUTH_AUTO_CREATE_USER: "false"
      REMOTE_AUTH_DEFAULT_GROUPS: ""
      AUTH_LDAP_SERVER_URI: ldaps://dc1.ipam.test:636
      AUTH_LDAP_BIND_DN: CN=Administrator,CN=Users,DC=ipam,DC=test
      AUTH_LDAP_BIND_PASSWORD: LocalAdAdminPassw0rd!
      AUTH_LDAP_USER_SEARCH_BASEDN: CN=Users,DC=ipam,DC=test
      AUTH_LDAP_USER_SEARCH_ATTR: sAMAccountName
      AUTH_LDAP_GROUP_SEARCH_BASEDN: CN=Users,DC=ipam,DC=test
      AUTH_LDAP_GROUP_SEARCH_CLASS: group
      AUTH_LDAP_GROUP_TYPE: NestedActiveDirectoryGroupType
      AUTH_LDAP_REQUIRE_GROUP_DN: CN=platform-operators,CN=Users,DC=ipam,DC=test
      AUTH_LDAP_MIRROR_GROUPS: "true"
      LDAP_CA_CERT_FILE: /ad-state/private/tls/ca.pem
    volumes:
      - samba-ad-state:/ad-state:ro
    depends_on:
      samba-ad:
        condition: service_healthy

  ui-proxy:
    entrypoint: ["/bin/sh", "/entrypoint-ldap.sh"]
    volumes:
      - ./ui-proxy/Caddyfile.ldap:/etc/caddy/Caddyfile.ldap:ro
      - ./ui-proxy/entrypoint-ldap.sh:/entrypoint-ldap.sh:ro

volumes:
  samba-ad-config:
  samba-ad-state:
