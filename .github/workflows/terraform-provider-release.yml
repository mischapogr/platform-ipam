name: Terraform provider release (reusable)

on:
  workflow_call:
    inputs:
      source-ref:
        description: Reviewed 40-character commit SHA in mischapogr/platform-ipam
        required: true
        type: string
      signing-key-fingerprint:
        description: Full fingerprint of the RSA or DSA public key registered with Terraform Registry
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: provider-mirror
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mischapogr/platform-ipam
          ref: ${{ inputs.source-ref }}
          path: platform-ipam-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: platform-ipam-source/providers/terraform/go.sum
      - name: Verify source commit is on main
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "source-ref must be a full commit SHA" >&2; exit 1; }
          git -C platform-ipam-source fetch --no-tags origin main
          git -C platform-ipam-source merge-base --is-ancestor "$SOURCE_REF" FETCH_HEAD
      - name: Verify tagged provider mirror matches reviewed source
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          python3 platform-ipam-source/scripts/release/check-provider-mirror.py \
            --mirror provider-mirror \
            --source platform-ipam-source/providers/terraform \
            --source-ref "$SOURCE_REF"
      - name: Validate version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY##*/}" == terraform-provider-platformipam ]] || { echo "Release must run in the selected public terraform-provider-platformipam repository" >&2; exit 1; }
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Expected a stable or rc.N SemVer tag such as v0.1.0-rc.1; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          owner="${GITHUB_REPOSITORY%%/*}"
          echo "address=registry.terraform.io/${owner,,}/platformipam" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require reviewed sandbox qualification for this version and source
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 platform-ipam-source/scripts/release/check-provider-qualification.py \
            --mirror provider-mirror --source-ref "$SOURCE_REF" --version "$VERSION"
      - name: Require version and compatibility qualification to match the release attestation
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 platform-ipam-source/providers/terraform/scripts/check-compatibility.py \
            --expected-version "$VERSION" --release \
            --qualification provider-mirror/RELEASE_QUALIFICATION.json
      - name: Verify provider formatting and unit tests before signing
        working-directory: platform-ipam-source/providers/terraform
        env:
          TF_ACC: ''
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go test -mod=readonly ./...
      - name: Build and package the qualified linux_amd64 artifact
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PROVIDER_ADDRESS: ${{ steps.version.outputs.address }}
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_DIRECTORY=platform-ipam-source/providers/terraform
          [[ -f "$PROVIDER_DIRECTORY/go.mod" ]] || { echo "Provider module is missing" >&2; exit 1; }
          binary="terraform-provider-platformipam_v${VERSION}"
          mkdir -p build
          (
            cd "$PROVIDER_DIRECTORY"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -buildvcs=false -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.providerAddress=${PROVIDER_ADDRESS}" \
              -o "$GITHUB_WORKSPACE/build/$binary" .
          )
          python3 platform-ipam-source/scripts/release/package-provider.py \
            --binary "build/$binary" --manifest "$PROVIDER_DIRECTORY/terraform-registry-manifest.json" \
            --version "$VERSION" --out dist
          cp provider-mirror/RELEASE_QUALIFICATION.json dist/RELEASE_QUALIFICATION.json
      - name: Sign checksums for Terraform Registry verification
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.version.outputs.value }}
          SIGNING_FINGERPRINT: ${{ inputs.signing-key-fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SIGNING_FINGERPRINT" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo "Expected a full signing-key fingerprint" >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/provider-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf -- "$GNUPGHOME"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_algorithm="$(gpg --batch --with-colons --list-secret-keys "$SIGNING_FINGERPRINT" | awk -F: '$1 == "sec" { print $4; exit }')"
          [[ "$key_algorithm" == 1 || "$key_algorithm" == 3 || "$key_algorithm" == 17 ]] || { echo "Terraform Registry requires an RSA or DSA signing key" >&2; exit 1; }
          python3 platform-ipam-source/scripts/release/check-provider-assets.py --directory dist --version "$VERSION"
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$SIGNING_FINGERPRINT" --detach-sign \
            --output "dist/terraform-provider-platformipam_${VERSION}_SHA256SUMS.sig" \
            "dist/terraform-provider-platformipam_${VERSION}_SHA256SUMS"
          python3 platform-ipam-source/scripts/release/check-provider-assets.py \
            --directory dist --version "$VERSION" --signing-fingerprint "$SIGNING_FINGERPRINT"
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          SOURCE_REF: ${{ inputs.source-ref }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          release_args=()
          notes="Signed Platform-IPAM Terraform provider v${VERSION} (linux_amd64). Source commit: ${SOURCE_REF}."
          if [[ "$IS_PRERELEASE" == true ]]; then
            release_args+=(--prerelease)
            notes="$notes Simulation-qualified RC. AWS API/AWS integration is not yet ready."
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "dist/terraform-provider-platformipam_${VERSION}_linux_amd64.zip" \
            "dist/terraform-provider-platformipam_${VERSION}_manifest.json" \
            "dist/terraform-provider-platformipam_${VERSION}_SHA256SUMS" \
            "dist/terraform-provider-platformipam_${VERSION}_SHA256SUMS.sig" \
            dist/RELEASE_QUALIFICATION.json \
            --verify-tag --title "Terraform provider v${VERSION}" \
            --notes "$notes" "${release_args[@]}"
