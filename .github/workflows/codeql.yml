name: CodeQL

on:
  push:
    branches: [main, develop, feat/close-non-aws-work-plan]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '19 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feat/') }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: |
            go.sum
            providers/terraform/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build both Go modules for CodeQL
        if: matrix.language == 'go'
        run: |
          go build -mod=readonly ./...
          (cd providers/terraform && go build -mod=readonly ./...)
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
