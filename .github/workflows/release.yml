name: platform-ipam release artifact

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      image_repository:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          push: false
          tags: ${{ inputs.image_repository }}:${{ inputs.version }}
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Package chart
        run: helm package deploy/helm/platform-ipam --version "${{ inputs.version }}" --app-version "${{ inputs.version }}"
