{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform-ipam.fullname" . }}-api
  labels:
    {{- include "platform-ipam.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform-ipam.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.apiIngress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.apiIngress.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.networkPolicy.egress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform-ipam.fullname" . }}-worker
  labels:
    {{- include "platform-ipam.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform-ipam.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.networkPolicy.egress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
{{- if .Values.operatorJob.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform-ipam.fullname" . }}-operator-job
  labels:
    {{- include "platform-ipam.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform-ipam.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: operator-job
  # Egress only: the Job's pod is never a server, exactly like -worker above.
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if eq .Values.operatorJob.mode "adopt" }}
    # adopt gets what the worker gets (docs/WORK_PLAN.md package H3,
    # requirement 6): the SAME chart-wide egress list as the -worker policy
    # above, not a copy of it, so the two cannot drift apart.
    {{- range .Values.networkPolicy.egress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
    {{- else }}
    # onboard and seed (docs/WORK_PLAN.md package N4) both get NetBox + DNS
    # only -- their OWN, separately scoped egress list (like
    # uiProxy.networkPolicy.egress), never the chart-wide list above, which
    # may carry database/AWS/OIDC destinations neither must ever reach. An
    # empty list denies all non-DNS egress.
    {{- range .Values.operatorJob.networkPolicy.egress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
