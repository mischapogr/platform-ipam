{{- range $name := list "api" "worker" }}
{{- $workload := index $.Values $name }}
{{- if $workload.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform-ipam.serviceAccountName" (dict "root" $ "workload" $workload "name" $name) }}
  labels:
    {{- include "platform-ipam.labels" $ | nindent 4 }}
  annotations:
    {{- toYaml $workload.serviceAccount.annotations | nindent 4 }}
---
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform-ipam.fullname" $ }}-migration
  labels:
    {{- include "platform-ipam.labels" $ | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
{{- if and $.Values.operatorJob.enabled (eq $.Values.operatorJob.mode "onboard") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  # Dedicated to templates/operator-job.yaml's mode: onboard pod
  # (docs/WORK_PLAN.md package H3, requirement 5). Deliberately carries NO
  # annotations -- unlike api/worker/migration this ServiceAccount has no
  # `annotations` value at all to set, precisely so a deployer cannot attach
  # a cloud-role (IRSA) annotation here by mistake: onboard never builds a
  # cloud observer and must never be able to assume the worker's role.
  # operator-job.yaml also sets automountServiceAccountToken: false on the
  # pod, so this identity's own token is never mounted either.
  name: {{ include "platform-ipam.fullname" $ }}-operator-job
  labels:
    {{- include "platform-ipam.labels" $ | nindent 4 }}
    app.kubernetes.io/component: operator-job
{{- end }}
