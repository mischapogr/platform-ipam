apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-ipam.fullname" . }}-api
  labels:
    {{- include "platform-ipam.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "platform-ipam.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
