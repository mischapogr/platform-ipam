{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "platform-ipam.fullname" . }}-api
  labels:
    {{- include "platform-ipam.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.apiMinAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform-ipam.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "platform-ipam.fullname" . }}-worker
  labels:
    {{- include "platform-ipam.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.workerMinAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform-ipam.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
{{- end }}
