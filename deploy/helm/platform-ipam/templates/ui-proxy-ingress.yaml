{{- if .Values.uiProxy.enabled }}
{{- if .Values.uiProxy.ingress.enabled }}
{{- if not .Values.uiProxy.ingress.tlsSecretName }}
{{- fail "uiProxy.ingress.enabled requires uiProxy.ingress.tlsSecretName: HTTP Basic credentials must never cross the wire in plaintext (ADR 0006 rule 7, docs/GUI_AUTHENTICATION.md)." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform-ipam.fullname" . }}-ui-proxy
  labels:
    {{- include "platform-ipam.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui-proxy
  annotations:
    {{- toYaml .Values.uiProxy.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.uiProxy.ingress.className }}
  tls:
    - hosts: [{{ .Values.uiProxy.ingress.host | quote }}]
      secretName: {{ .Values.uiProxy.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.uiProxy.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-ipam.fullname" . }}-ui-proxy
                port:
                  name: http
{{- end }}
{{- end }}
