openapi: 3.1.0
info:
  title: Platform IPAM API
  version: 1.0.0-draft
  description: |
    Proposed v1 API for tenant-scoped network allocation. Tenant and target
    authorization are derived from the bearer token; request bodies never carry
    tenant IDs, owners, or role claims.
servers:
  - url: https://platform-ipam.example.com
    description: Illustrative production origin
security:
  - bearerAuth: []
paths:
  /v1/allocations:
    post:
      operationId: reserveAllocation
      summary: Reserve a VPC or subnet allocation, or recover its durable result
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationRequest' }
      responses:
        '200': { $ref: '#/components/responses/ExistingAllocation' }
        '201': { $ref: '#/components/responses/CreatedAllocation' }
        '202': { $ref: '#/components/responses/PendingOperation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      operationId: listAllocations
      summary: List committed allocations visible to the authenticated tenant
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AllocationKeyFilter'
        - $ref: '#/components/parameters/ScopeFilter'
        - $ref: '#/components/parameters/EnvironmentFilter'
        - $ref: '#/components/parameters/RegionFilter'
        - $ref: '#/components/parameters/StateFilter'
        - $ref: '#/components/parameters/ParentAllocationIDFilter'
      responses:
        '200': { $ref: '#/components/responses/AllocationList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/allocations/{allocation_id}:
    parameters:
      - $ref: '#/components/parameters/AllocationID'
    get:
      operationId: getAllocation
      summary: >-
        Read a committed allocation or its durable tombstone. For the
        AUTHENTICATED TENANT'S OWN uncommitted allocation whose operation is
        still PENDING, answers 409 allocation_pending instead (ADR 0011 stage
        two keeps this read's grant to an operator unchanged: an uncommitted
        hold is never visible to an operator, so this code is a tenant-only
        possibility) -- see the Conflict response.
      responses:
        '200': { $ref: '#/components/responses/Allocation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      operationId: updateAllocationMetadata
      summary: Replace mutable allocation metadata with a revision precondition
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationPatch' }
      responses:
        '200': { $ref: '#/components/responses/Allocation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: requestAllocationRelease
      summary: Persist release intent and quarantine an allocation
      responses:
        '202': { $ref: '#/components/responses/QuarantinedAllocation' }
        '204':
          description: The allocation was already RELEASED.
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/allocations/{allocation_id}/binding:
    parameters:
      - $ref: '#/components/parameters/AllocationID'
    put:
      operationId: verifyAllocationBinding
      summary: Submit an AWS resource candidate for independent verification
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindingCandidate' }
      responses:
        '200': { $ref: '#/components/responses/Allocation' }
        '202': { $ref: '#/components/responses/PendingOperation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/operations/{operation_id}:
    parameters:
      - $ref: '#/components/parameters/OperationID'
    get:
      operationId: getOperation
      summary: Read a pending or terminal durable operation
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: cancelReservation
      summary: Cancel the caller's own pending reservation the platform has declared stuck (ADR 0013)
      description: >-
        No request body; any body sent with the DELETE is ignored, exactly as
        DELETE /v1/allocations/{allocation_id} ignores one. Available only to
        the tenant that owns the operation (an operator is refused with 404,
        the same comparison and the same body GET /v1/operations/{operation_id}
        already uses), and only while an open reservation_stuck finding names
        the allocation -- a reservation that is merely slow, still inside its
        own creation, or refused for a reason the platform could not verify
        answers 409 reservation_not_stuck. A committed allocation is refused
        absolutely and first, with 409 cancel_committed, whatever state it is
        in; release it with DELETE /v1/allocations/{allocation_id} instead.
        On success the operation is fenced to FAILED with the durable code
        reservation_cancelled, any NetBox prefix carrying the allocation's
        marker is removed, and the uncommitted allocation row and the
        caller's own idempotency record are deleted, freeing the allocation
        key for a fresh reservation under the same Idempotency-Key. A repeat
        DELETE after a cancel that already finished converges on the same
        report rather than refusing. Other 409 codes: cancel_no_allocation,
        cancel_not_a_reservation, cancel_operation_succeeded (the commit won
        the race; release the now-owned allocation instead),
        cancel_operation_terminal, cancel_state_changed (the allocation or
        its fence changed while this cancel was running; not retryable, a
        fresh DELETE reports the current state). 503 cancel_uncertain and
        503 cancel_incomplete are both retryable: nothing has been deleted
        and re-running the cancel is safe. When the fence had already
        succeeded before one of these later refusals -- cancel_uncertain,
        cancel_incomplete, cancel_inventory_refused, cancel_state_changed --
        error.details additionally carries the fenced allocation_id and
        operation_id plus this run's own progress flags (fenced,
        already_fenced, removed, deleted: work-plan package H9), exactly
        what internal/service/cancel.go's CancelReport had already
        established before the run stopped, so a caller need not guess
        whether the fence or the removal happened. Every refusal the fence
        itself makes -- 404, cancel_committed, cancel_no_allocation,
        cancel_not_a_reservation, cancel_operation_succeeded,
        cancel_operation_terminal, reservation_not_stuck -- is decided
        before anything is established and carries no such details.
      responses:
        '200': { $ref: '#/components/responses/CancelReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/pools:
    get:
      operationId: listPools
      summary: List authorized pool summaries and policies
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/PoolList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/pools/{pool_id}/capacity:
    parameters:
      - $ref: '#/components/parameters/PoolID'
    get:
      operationId: getPoolCapacity
      summary: Read capacity by lifecycle state and prefix length
      responses:
        '200': { $ref: '#/components/responses/Capacity' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/findings:
    get:
      operationId: listFindings
      summary: List authorized drift and coverage findings
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/FindingList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: platform-access-token
  parameters:
    AllocationID:
      name: allocation_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AllocationID' }
    OperationID:
      name: operation_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OperationID' }
    PoolID:
      name: pool_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PoolID' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7e]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current allocation revision expressed as a quoted integer, for example `"7"`.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    AllocationKeyFilter:
      name: allocation_key
      in: query
      schema: { $ref: '#/components/schemas/AllocationKey' }
    ScopeFilter:
      name: scope
      in: query
      schema: { $ref: '#/components/schemas/Scope' }
    EnvironmentFilter:
      name: environment
      in: query
      schema: { $ref: '#/components/schemas/Environment' }
    RegionFilter:
      name: region
      in: query
      schema: { $ref: '#/components/schemas/Region' }
    StateFilter:
      name: state
      in: query
      schema: { $ref: '#/components/schemas/AllocationState' }
    ParentAllocationIDFilter:
      name: parent_allocation_id
      in: query
      schema: { $ref: '#/components/schemas/AllocationID' }
  headers:
    RequestID:
      description: Opaque request correlation ID present on every response.
      schema: { type: string, minLength: 1 }
    ETag:
      description: Current allocation revision expressed as a quoted integer.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Location:
      description: Canonical relative resource or operation URI.
      schema: { type: string, pattern: '^/v1/' }
    RetryAfter:
      description: Seconds before a client polls or retries.
      schema: { type: integer, minimum: 1 }
  responses:
    Allocation:
      description: Allocation representation.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        ETag: { $ref: '#/components/headers/ETag' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Allocation' } } }
    CreatedAllocation:
      description: A new committed reservation.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        ETag: { $ref: '#/components/headers/ETag' }
        Location: { $ref: '#/components/headers/Location' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Allocation' } } }
    ExistingAllocation:
      description: Existing committed allocation recovered by permanent allocation key or idempotency replay.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        ETag: { $ref: '#/components/headers/ETag' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Allocation' } } }
    QuarantinedAllocation:
      description: Durable release intent accepted; CIDR remains held while quarantined.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        ETag: { $ref: '#/components/headers/ETag' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Allocation' } } }
    PendingOperation:
      description: External outcome remains unresolved. Poll the Location; do not choose another CIDR or key.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Location: { $ref: '#/components/headers/Location' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/json: { schema: { $ref: '#/components/schemas/PendingOperation' } } }
    Operation:
      description: Durable operation representation.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
    CancelReport:
      description: The reservation was withdrawn, or a repeat of a cancel that had already finished converged on the same report.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CancelReport' } } }
    AllocationList:
      description: Cursor page ordered by immutable allocation ID. It is not a snapshot across pages.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/AllocationPage' } } }
    PoolList:
      description: Cursor page ordered by immutable pool ID.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PoolPage' } } }
    Capacity:
      description: Capacity report; it does not grant a reservation.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Capacity' } } }
    FindingList:
      description: Cursor page ordered by immutable finding ID.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/FindingPage' } } }
    BadRequest:
      description: Malformed JSON or missing/invalid idempotency key.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthenticated:
      description: No valid platform access token was presented.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: The authenticated principal is not authorized for this target. GET /v1/pools alone may also answer this with code no_eligible_pool when the authenticated identity's tenant is eligible for no pool (ADR 0011); no other endpoint returns that code.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Resource is unknown or is not visible to the authenticated tenant.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: >-
        A durable identity, lifecycle, binding, capacity, or inventory
        conflict occurred. POST /v1/allocations alone may also answer this
        with code adoption_abandoning or reservation_cancelling (both
        retryable) when a replay lands inside the window of a colliding
        withdrawal in progress -- an operator's adopt abandon (ADR 0012) or a
        tenant's own DELETE /v1/operations/{operation_id} (ADR 0013); no
        other endpoint returns either code. GET /v1/allocations/{allocation_id}
        alone may also answer this with code allocation_pending, retryable,
        when the caller is the OWNING TENANT and the allocation is
        uncommitted with a still-PENDING RESERVE or ADOPT operation (E3,
        docs/API_V1.md section 5): error.details carries that operation's id
        as details.operation_id (a string matching OperationID's pattern), so
        the caller can poll GET /v1/operations/{details.operation_id} instead
        of retrying this read blindly. No other caller of this endpoint ever
        sees allocation_pending -- another tenant and an unknown id both stay
        404 with one identical body, an operator stays 404 (ADR 0011: an
        uncommitted hold is never leaked through a different status), and an
        uncommitted hold whose operation is not PENDING (none at all, or one
        left FAILED by a cancel's or an abandon's fence window) stays 404 too.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    PreconditionFailed:
      description: If-Match does not identify the current allocation revision.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unprocessable:
      description: Request shape is valid JSON but violates API or policy validation.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    RateLimited:
      description: Request is rate limited.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unavailable:
      description: Ledger, dependency, or admission domain is temporarily unavailable.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    AllocationID: { type: string, pattern: '^alloc_[A-Za-z0-9_-]+$' }
    OperationID: { type: string, pattern: '^op_[A-Za-z0-9_-]+$' }
    PoolID: { type: string, pattern: '^pool_[A-Za-z0-9_-]+$' }
    FindingID: { type: string, pattern: '^finding_[A-Za-z0-9_-]+$' }
    AllocationKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
    AccountID: { type: string, pattern: '^[0-9]{12}$' }
    Environment: { type: string, minLength: 1, maxLength: 32 }
    Region: { type: string, minLength: 1, maxLength: 64 }
    Scope: { type: string, enum: [vpc, subnet] }
    AddressFamily: { type: string, enum: [ipv4] }
    AllocationState: { type: string, enum: [RESERVED, ACTIVE, QUARANTINED, RELEASED] }
    InventorySync: { type: string, enum: [CURRENT, PENDING, CONFLICT] }
    RFC3339Time: { type: string, format: date-time }
    Labels:
      type: object
      maxProperties: 20
      propertyNames: { type: string, minLength: 1, maxLength: 64, pattern: '^(?!platform-ipam/)' }
      additionalProperties: { type: string, maxLength: 256 }
    AllocationRequest:
      type: object
      additionalProperties: false
      required: [allocation_key, scope, environment, region, prefix_length]
      properties:
        allocation_key: { $ref: '#/components/schemas/AllocationKey' }
        scope: { $ref: '#/components/schemas/Scope' }
        environment: { $ref: '#/components/schemas/Environment' }
        region: { $ref: '#/components/schemas/Region' }
        account_id: { $ref: '#/components/schemas/AccountID' }
        address_family: { $ref: '#/components/schemas/AddressFamily', default: ipv4 }
        prefix_length: { type: integer, minimum: 0, maximum: 32 }
        parent_allocation_id: { $ref: '#/components/schemas/AllocationID' }
        availability_zone_id: { type: string, minLength: 1, maxLength: 32, pattern: '^[a-z0-9-]+$' }
        description: { type: string, maxLength: 512, default: '' }
        labels: { $ref: '#/components/schemas/Labels' }
      allOf:
        - if: { properties: { scope: { const: subnet } }, required: [scope] }
          then: { required: [parent_allocation_id] }
        - if: { properties: { scope: { const: vpc } }, required: [scope] }
          then:
            not:
              anyOf:
                - { required: [parent_allocation_id] }
                - { required: [availability_zone_id] }
    AllocationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description: { type: string, maxLength: 512 }
        labels: { $ref: '#/components/schemas/Labels' }
    BindingCandidate:
      type: object
      additionalProperties: false
      required: [provider, resource_type, resource_id, account_id, region]
      properties:
        provider: { type: string, enum: [aws] }
        resource_type: { type: string, enum: [vpc, subnet] }
        resource_id: { type: string, minLength: 1, maxLength: 128 }
        account_id: { $ref: '#/components/schemas/AccountID' }
        region: { $ref: '#/components/schemas/Region' }
    Binding:
      type: object
      additionalProperties: false
      required: [provider, resource_type, resource_id, account_id, region, verified_at]
      properties:
        provider: { type: string, enum: [aws] }
        resource_type: { type: string, enum: [vpc, subnet] }
        resource_id: { type: string, minLength: 1, maxLength: 128 }
        account_id: { $ref: '#/components/schemas/AccountID' }
        region: { $ref: '#/components/schemas/Region' }
        verified_at: { $ref: '#/components/schemas/RFC3339Time' }
    AllocationLinks:
      type: object
      additionalProperties: false
      required: [self]
      properties:
        self: { type: string, pattern: '^/v1/allocations/' }
        inventory: { type: string, format: uri }
    Allocation:
      type: object
      additionalProperties: false
      required: [id, allocation_key, scope, environment, region, account_id, address_family, prefix_length, cidr, pool_id, parent_allocation_id, availability_zone_id, description, labels, state, revision, policy_version, binding, release_requested_at, quarantine_until, release_blockers, inventory_sync, last_observed_at, created_at, updated_at, links]
      properties:
        id: { $ref: '#/components/schemas/AllocationID' }
        allocation_key: { $ref: '#/components/schemas/AllocationKey' }
        scope: { $ref: '#/components/schemas/Scope' }
        environment: { $ref: '#/components/schemas/Environment' }
        region: { $ref: '#/components/schemas/Region' }
        account_id: { $ref: '#/components/schemas/AccountID' }
        address_family: { $ref: '#/components/schemas/AddressFamily' }
        prefix_length: { type: integer, minimum: 0, maximum: 32 }
        cidr: { type: string, format: ipv4-cidr }
        pool_id: { $ref: '#/components/schemas/PoolID' }
        parent_allocation_id: { oneOf: [{ $ref: '#/components/schemas/AllocationID' }, { type: 'null' }] }
        availability_zone_id: { oneOf: [{ type: string }, { type: 'null' }] }
        description: { type: string, maxLength: 512 }
        labels: { $ref: '#/components/schemas/Labels' }
        state: { $ref: '#/components/schemas/AllocationState' }
        revision: { type: integer, minimum: 1 }
        policy_version: { type: string, minLength: 1 }
        binding: { oneOf: [{ $ref: '#/components/schemas/Binding' }, { type: 'null' }] }
        release_requested_at: { oneOf: [{ $ref: '#/components/schemas/RFC3339Time' }, { type: 'null' }] }
        quarantine_until: { oneOf: [{ $ref: '#/components/schemas/RFC3339Time' }, { type: 'null' }] }
        release_blockers: { type: array, items: { type: string, minLength: 1 }, uniqueItems: true }
        inventory_sync: { $ref: '#/components/schemas/InventorySync' }
        last_observed_at: { oneOf: [{ $ref: '#/components/schemas/RFC3339Time' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/RFC3339Time' }
        updated_at: { $ref: '#/components/schemas/RFC3339Time' }
        links: { $ref: '#/components/schemas/AllocationLinks' }
        tenant_id: { type: string, minLength: 1, description: 'The owning tenant. Present only for an operator identity (ADR 0011); absent from every other caller''s response to the same read, including the owning tenant''s own.' }
    AllocationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Allocation' } }
        next_cursor: { oneOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
    OperationError:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        request_id: { type: string, minLength: 1 }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
    PendingOperation:
      type: object
      additionalProperties: false
      required: [id, type, status, allocation_id, result, error]
      properties:
        id: { $ref: '#/components/schemas/OperationID' }
        type: { type: string, enum: [RESERVE, VERIFY_BINDING, RELEASE, RECLAIM] }
        status: { const: PENDING }
        allocation_id: { $ref: '#/components/schemas/AllocationID' }
        result: { type: 'null' }
        error: { type: 'null' }
    SucceededOperation:
      type: object
      additionalProperties: false
      required: [id, type, status, allocation_id, result, error]
      properties:
        id: { $ref: '#/components/schemas/OperationID' }
        type: { type: string, enum: [RESERVE, VERIFY_BINDING, RELEASE, RECLAIM] }
        status: { const: SUCCEEDED }
        allocation_id: { $ref: '#/components/schemas/AllocationID' }
        result:
          type: object
          additionalProperties: false
          required: [allocation_id]
          properties: { allocation_id: { $ref: '#/components/schemas/AllocationID' } }
        error: { type: 'null' }
    FailedOperation:
      description: >-
        error.code is a free string; a RESERVE carries reservation_cancelled
        for ever once its tenant has cancelled it through
        DELETE /v1/operations/{operation_id} (ADR 0013) -- the allocation row
        is then gone and GET /v1/allocations/{allocation_id} answers 404, but
        this terminal representation keeps answering 200 with this operation.
      type: object
      additionalProperties: false
      required: [id, type, status, allocation_id, result, error]
      properties:
        id: { $ref: '#/components/schemas/OperationID' }
        type: { type: string, enum: [RESERVE, VERIFY_BINDING, RELEASE, RECLAIM] }
        status: { const: FAILED }
        allocation_id: { $ref: '#/components/schemas/AllocationID' }
        result: { type: 'null' }
        error: { $ref: '#/components/schemas/OperationError' }
    Operation:
      oneOf:
        - $ref: '#/components/schemas/PendingOperation'
        - $ref: '#/components/schemas/SucceededOperation'
        - $ref: '#/components/schemas/FailedOperation'
      discriminator: { propertyName: status }
    Pool:
      type: object
      additionalProperties: false
      required: [id, scopes, environment, region, allowed_prefix_lengths, policy_version]
      properties:
        id: { $ref: '#/components/schemas/PoolID' }
        scopes: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/Scope' } }
        environment: { $ref: '#/components/schemas/Environment' }
        region: { $ref: '#/components/schemas/Region' }
        allowed_prefix_lengths: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 32 } }
        policy_version: { type: string, minLength: 1 }
    PoolPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Pool' } }
        next_cursor: { oneOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
    CapacityCounts:
      type: object
      additionalProperties: false
      required: [allocatable, reserved, active, quarantined, pending, excluded]
      properties:
        allocatable: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        quarantined: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        excluded: { type: integer, minimum: 0 }
    Capacity:
      type: object
      additionalProperties: false
      required: [pool_id, observed_at, complete, by_prefix_length]
      properties:
        pool_id: { $ref: '#/components/schemas/PoolID' }
        observed_at: { $ref: '#/components/schemas/RFC3339Time' }
        complete: { type: boolean }
        by_prefix_length:
          type: object
          additionalProperties: { $ref: '#/components/schemas/CapacityCounts' }
    Finding:
      type: object
      additionalProperties: false
      required: [id, severity, code, allocation_id, account_id, region, first_observed_at, last_observed_at, status]
      properties:
        id: { $ref: '#/components/schemas/FindingID' }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        code: { type: string, minLength: 1 }
        allocation_id: { oneOf: [{ $ref: '#/components/schemas/AllocationID' }, { type: 'null' }] }
        account_id: { oneOf: [{ $ref: '#/components/schemas/AccountID' }, { type: 'null' }] }
        region: { oneOf: [{ $ref: '#/components/schemas/Region' }, { type: 'null' }] }
        first_observed_at: { $ref: '#/components/schemas/RFC3339Time' }
        last_observed_at: { $ref: '#/components/schemas/RFC3339Time' }
        status: { type: string, enum: [OPEN, RESOLVED] }
        domain_id: { type: string, minLength: 1, description: 'The overlap domain this finding belongs to. Present only for an operator identity (ADR 0011); absent from every tenant response.' }
        resource_type: { type: string, enum: [vpc, subnet], description: 'The cloud resource this domain-level (occupancy) finding is about. Present only for an operator identity, and only when the finding carries a resource identity; a finding that names an allocation (allocation_id is set) leaves this absent, since its resource is reachable through the allocation''s own binding.' }
        resource_id: { type: string, minLength: 1, maxLength: 128, description: 'Paired with resource_type; present under the same condition.' }
        tenant_id: { type: string, minLength: 1, description: 'The one tenant this finding names. Present only for an operator identity, and only where allocation_id is set: a domain-level (grouped occupancy) finding has no single recipient tenant, so this key is absent -- not null -- there.' }
    FindingPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        next_cursor: { oneOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/OperationError' }
    CancelledAllocation:
      description: Projection of the uncommitted hold DELETE /v1/operations/{operation_id} withdrew; not the same shape as Allocation, since most of that schema no longer applies once the row is gone.
      type: object
      additionalProperties: false
      required: [id, allocation_key, tenant_id, domain_id, cidr, state, committed]
      properties:
        id: { $ref: '#/components/schemas/AllocationID' }
        allocation_key: { $ref: '#/components/schemas/AllocationKey' }
        tenant_id: { type: string, minLength: 1 }
        domain_id: { type: string, minLength: 1 }
        cidr: { type: string, format: ipv4-cidr }
        state: { $ref: '#/components/schemas/AllocationState' }
        committed: { const: false, description: 'Always false: a committed allocation can never be cancelled by this path (ADR 0013).' }
    CancelledOperation:
      type: object
      additionalProperties: false
      required: [id, type, status]
      properties:
        id: { $ref: '#/components/schemas/OperationID' }
        type: { const: RESERVE }
        status: { const: FAILED }
    CancelReport:
      description: What DELETE /v1/operations/{operation_id} did, field for field from internal/service/cancel.go's CancelReport (ADR 0013). A refusal (404/409/503) returns the standard ErrorResponse instead, never this schema.
      type: object
      additionalProperties: false
      required: [at, actor, allocation, operation, fenced, already_fenced, removed, deleted, finding_resolved]
      properties:
        at: { $ref: '#/components/schemas/RFC3339Time' }
        actor: { type: string, minLength: 1, description: 'The authenticated Principal.Subject that requested the cancel.' }
        allocation: { $ref: '#/components/schemas/CancelledAllocation' }
        operation: { $ref: '#/components/schemas/CancelledOperation' }
        fenced: { type: boolean, description: 'true when this call wrote the fence; false when an earlier, interrupted run had already written it (see already_fenced).' }
        already_fenced: { type: boolean, description: 'true when this call resumed from a fence an earlier, interrupted run had already written.' }
        removed: { type: boolean, description: 'true when this call got an answer from the inventory that nothing carries the allocation''s marker. A converging re-run that finds the hold already deleted does not ask the inventory at all and reports false here with deleted true.' }
        deleted: { type: boolean, description: 'true once the uncommitted allocation row is gone from the ledger, whether this call deleted it or found it already gone.' }
        finding_resolved: { type: boolean, description: 'true when this call resolved the reservation_stuck finding that justified the cancel.' }
