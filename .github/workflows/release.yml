name: platform-ipam release artifact

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      image_repository:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable SemVer value such as 0.1.0" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          push: false
          tags: ${{ inputs.image_repository }}:${{ inputs.version }}
          outputs: type=docker,dest=/tmp/platform-ipam-image.tar
      - name: Prepare downloadable release artifacts
        run: mkdir -p dist && mv /tmp/platform-ipam-image.tar dist/platform-ipam-image.tar
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Package chart
        env:
          VERSION: ${{ inputs.version }}
        run: helm package deploy/helm/platform-ipam --version "$VERSION" --app-version "$VERSION" --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: platform-ipam-${{ inputs.version }}-release-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 14
