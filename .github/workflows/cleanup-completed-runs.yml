name: Delete completed workflow runs

on:
  workflow_run:
    workflows:
      - platform-ipam CI
      - CodeQL
      - platform-ipam release artifact
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-completed-runs.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete-completed-runs:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed runs and their artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            [[ "$TARGET_RUN_ID" =~ ^[0-9]+$ ]]
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID"
            exit 0
          fi

          ids_file="$RUNNER_TEMP/completed-run-ids.txt"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[].id' > "$ids_file"
          while IFS= read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            sleep 0.1
          done < "$ids_file"
