schema_version: 1
policy_version: development-1

overlap_domains:
  - id: local-development
    description: Disposable local Compose address domain
    coverage_generation: development-1
    inventory_backend:
      type: netbox
      vrf_id: 1
      require_unique_prefixes: true
    cloud_coverage:
      - account_id: "000000000000"
        role_arn: arn:aws:iam::000000000000:role/LocalFake
        regions: [eu-central-1]

pools:
  - id: pool_dev_euc1
    overlap_domain: local-development
    cidr: 10.64.0.0/16
    address_family: ipv4
    scope: vpc
    environment: development
    region: eu-central-1
    eligible_tenants: [developer]
    eligible_accounts: ["000000000000"]
    allowed_prefix_lengths: [20, 22]
    excluded_cidrs: []
    max_unreclaimed_allocations_per_tenant: 32
    inventory_backend:
      parent_prefix_id: 1

lifecycle:
  reservation_expiry_enabled: false
  reservation_age_alert_hours: 24
  quarantine_hours: 168
  required_complete_absence_scans: 2
  minimum_scan_spacing_seconds: 1
  maximum_observation_age_seconds: 600

reconciliation:
  full_scan_interval_seconds: 30
  include_untagged_resources: true
  include_all_vpc_cidr_associations: true
  unknown_coverage_blocks_reuse: true

subnet_policy:
  require_parent_scope: vpc
  inherit_parent_target: true
  allowed_prefix_lengths: [24, 26]
  max_unreclaimed_children: 12
  allow_nested_subnets: false

identities:
  - subject: developer
    tenant_id: developer
    accounts: ["000000000000"]
    environments: [development]
    regions: [eu-central-1]
